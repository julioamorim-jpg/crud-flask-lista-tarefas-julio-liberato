<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Viagem</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body background="/static/fundo.png">

<header>
<h1 class="titulo">Cadastro de Viagem</h1>
</header>

<nav class="botoes">


        <a href="/">
            <button>Página Inicial</button>
        </a>

        <a href="/cadastrohotel">
            <button>Cadastro de Hotel</button>
        </a>

         <a href="/viagem/cadastrar"><button>Cadastrar Viagem</button></a>

    </nav>

<br><br>

<section>
<form action="/viagem/criar" method="post">
    <fieldset>
        <legend>Cadastro - Viagem</legend>

        <label for="destino">Destino da Viagem</label>
        <input type="text" id="destino" name="destino" required>

        <br><br>

          <label for="transporte">Tipo de transporte</label>
        <input type="text" id="transporte" name="transporte" required>

        <br><br>

        <label for="dias">Dias de Duração</label>
        <input type="number" id="dias" name="dias" placeholder="Quntidade de dias">

        <br><br>

        <label for="orcamento">Orçamento:</label>
        <input type="text" id="orcamento" name="orcamento" placeholder="Seu Orçamento">

        <br><br>

        <button type="submit">Cadastrar Sua Viagem</button>
    </fieldset>
</form>
</section>

</footer>

</body>
</html>
