<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hotel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body background="/static/fundo.png">

    <h1>Cadastro de Hotel</h1>

    <nav class="botoes">


        <a href="/">
            <button>Página Inicial</button>
        </a>

        <a href="/cadastrohotel">
            <button>Cadastro de Hotel</button>
        </a>

         <a href="/viagem/cadastrar"><button>Cadastrar Viagem</button></a>

    </nav>


    <br><br>

<section>
    <form action="/criarhotel" method = "post">
       <fieldset>

            <legend>Cadastro de Hotel</legend>

            <label for="nome">Nome:</label>
            <input type="text" name ="nome" >

            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" name ="cidade">


            <br><br>

            <label for="estrelas">Estrelas:</label>
            <select id="estrelas" name="estrelas">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
            </select>

            <br><br>

            <label for="diaria">Diaria:</label>
            <input type="number" name ="diaria">

            <br><br>

            <button type="submit">Cadastrar Hotel</button>

       </fieldset>
    </form>
</section>

<footer>
    <p>© 2026 Viagens. Todos os direitos reservados.<p>
    <p>Projeto desenvolvido para atividade escolar do Fel, pelos alunos: JUlio e P. Liberato
</footer>

</body>

</html>
