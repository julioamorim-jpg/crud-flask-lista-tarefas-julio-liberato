<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body background="/static/fundo.png">

<header>
    <h1 class="title">Editar Viagem</h1>
</header>


<nav class="botoes">


        <a href="/">
            <button>Página Inicial</button>
        </a>

        <a href="/cadastrohotel">
            <button>Cadastro de Hotel</button>
        </a>

         <a href="/viagem/cadastrar"><button>Cadastrar Viagem</button></a>

    </nav>



<p>Pagina de edição dda Viagem</p>

<br><br>

<section>
<form action="/viagem/alterar/{{ viagem[0] }}" method="post">
    <fieldset>
        <legend>Editar Viagem</legend>

        <label for="destino">Destino da viagem:</label>
        <input type="text" id="destino" name="destino" value="{{ viagem[1] }}" required>

        <br><br>

        <label for="transporte">Tipo de transporte:</label>
        <input type="text" id="transporte" name="transporte" value="{{ viagem[2] }}" placeholder="Nome do estabelecimento">

        <br><br>

        <label for="dias">Dias:</label>
        <input type="numer" id="dias" name="dias" value="{{ viagem[3] }}" placeholder="Dias de Viagem">

        <br><br>

        <label for="orcamento">Orçamento:</label>
        <input type="text" id="orcamento" name="orcamento" value="{{ viagem[4] }}" placeholder="Orçamento para a viagem">

        <br><br>

        <button type="submit">Editar Viagem</button>
    </fieldset>
</form>
</section>


<hr>

</body>
</html>
